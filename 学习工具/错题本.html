<style>
.hero-stats{display:flex;gap:44px;align-items:flex-end;flex-wrap:wrap;padding-bottom:6px}
.hero-stat .n{font-family:var(--serif);font-size:clamp(38px,5vw,64px);font-weight:700;line-height:1}
.hero-stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:10px}
.summary-line{font-size:12.5px;color:var(--ink-2);margin-top:24px;line-height:1.9}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px}
.cat-card{display:flex;flex-direction:column;gap:18px;text-align:left;background:var(--paper-2);border:1px solid var(--line-2);padding:25px 24px 22px;cursor:pointer;transition:border-color .18s,transform .18s,background .18s;color:var(--ink);font:inherit}
.cat-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat-card.active{border-color:var(--ink);background:#fffef7}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cat-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted)}
.cat-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;margin-top:8px}
.cat-total{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.cat-progress{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cat-progress b{font-family:var(--serif);font-size:42px;line-height:1;font-weight:700}
.cat-progress span{font-size:12px;color:var(--muted)}
.cat-wrong{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.cat-wrong b{color:var(--ink);font-size:13px}
.cat-bar{height:3px;background:var(--line);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.cat-open{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:13px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}
.cat-open span{color:var(--muted);letter-spacing:.04em}
.detail{margin-top:42px;border-top:1px solid var(--line-2);padding-top:26px;scroll-margin-top:80px}
.detail[hidden]{display:none}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.detail-head h2{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.3}
.detail-head .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.clear-all{background:none;border:1px solid var(--line-2);padding:8px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;color:var(--ink-2)}
.clear-all:hover{border-color:var(--ink);color:var(--ink)}
.clear-all:disabled{opacity:.4;cursor:default}
.wlist{margin-top:12px}
.wgroup-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);padding:22px 0 8px;border-bottom:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.wrow-main{min-width:0}
.wrow-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.wrow-meta .dot{width:3px;height:3px;background:var(--line-2);border-radius:50%}
.wrow a{font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.5}
.wrow a:hover{text-decoration:underline;text-underline-offset:3px}
.wrow p{font-size:11.5px;color:var(--ink-2);margin:5px 0 0;line-height:1.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrow-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.wbtn{background:none;border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;cursor:pointer;color:var(--muted);white-space:nowrap}
.wbtn:hover{border-color:var(--ink);color:var(--ink)}
.empty{padding:40px 0;color:var(--muted);font-size:12px}
.panel-hint{padding:28px 0 8px;color:var(--muted);font-size:12px}
@media(max-width:820px){
  .hero-stats{gap:30px}
  .cat-grid{grid-template-columns:1fr}
  .cat-progress b{font-size:36px}
  .wrow{grid-template-columns:1fr}
  .wrow-actions{flex-direction:row;justify-content:flex-start}
  .detail-head h2{font-size:24px}
}
</style>

<script src="../C语言/data.js"></script>
<script src="../算法/assets/app_data.js"></script>
<script>
(function(){
  const C_ANS = 'cquiz.ans.v1';
  const C_CODE = 'cquiz.code.';
  const ARENA_KEY = 'arena.v1';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || '{}') || fallback; } catch(e){ return fallback; } };
  const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} };

  const cQuestions = (window.CDATA && CDATA.questions) ? CDATA.questions : [];
  const aProblems = (window.ARENA && ARENA.problems) ? ARENA.problems : [];
  const cById = new Map(cQuestions.map(q => [q.id, q]));
  const aById = new Map(aProblems.map(p => [p.id, p]));
  const cAns = read(C_ANS, {});
  const arena = read(ARENA_KEY, { status:{}, book:{}, quiz:{}, lessons:{}, code:{}, wrong:{} });
  arena.status = arena.status || {}; arena.quiz = arena.quiz || {}; arena.code = arena.code || {}; arena.wrong = arena.wrong || {};

  function cWrittenSet(){
    const set = new Set();
    Object.keys(cAns).forEach(id => { if (cById.has(id)) set.add(id); });
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(C_CODE)) continue;
      const id = k.slice(C_CODE.length);
      if (cById.has(id) && (localStorage.getItem(k) || '').trim()) set.add(id);
    }
    return set;
  }
  function aWrittenSet(){
    const set = new Set();
    ['status','quiz','code'].forEach(k => {
      Object.keys(arena[k] || {}).forEach(id => {
        if (!aById.has(id)) return;
        const v = arena[k][id];
        if (k === 'status' && (!v || v === 'todo')) return;
        set.add(id);
      });
    });
    return set;
  }
  function cWrongList(){
    return cQuestions.filter(q => q.kind === 'single' && cAns[q.id] && cAns[q.id].ok === false)
      .sort((a,b) => Number(b.year) - Number(a.year) || Number(a.no) - Number(b.no));
  }
  function aWrongList(){
    return aProblems.filter(p => arena.wrong[p.id]);
  }

  let activeCat = '';

  function refresh(){
    const cw = cWrittenSet();
    const aw = aWrittenSet();
    const cW = cWrongList();
    const aW = aWrongList();
    const cTotal = cQuestions.length || 236;
    const aTotal = aProblems.length || 145;
    const total = cTotal + aTotal;

    $('#totalQ').textContent = total;
    $('#totalWritten').textContent = cw.size + aw.size;
    $('#totalWrong').textContent = cW.length + aW.length;
    $('#cTotal').textContent = cTotal;
    $('#cTotalInline').textContent = cTotal;
    $('#cWritten').textContent = cw.size;
    $('#cWrong').textContent = cW.length;
    $('#cBar').style.width = (cTotal ? Math.min(100, cw.size / cTotal * 100) : 0) + '%';
    $('#aTotal').textContent = aTotal;
    $('#aTotalInline').textContent = aTotal;
    $('#aWritten').textContent = aw.size;
    $('#aWrong').textContent = aW.length;
    $('#aBar').style.width = (aTotal ? Math.min(100, aw.size / aTotal * 100) : 0) + '%';
    $('#summaryLine').textContent = `一共 ${total} 题，已写 ${cw.size + aw.size} 题；其中 C 语言 ${cw.size}/${cTotal}，算法 ${aw.size}/${aTotal}。`;
    if (activeCat) renderDetail(activeCat, cW, aW);
  }

  function rowC(q){
    return `<div class="wrow">
      <div class="wrow-main">
        <div class="wrow-meta"><span>${esc(q.year)} 年</span><span class="dot"></span><span>${esc(q.title || '单选题')}</span></div>
        <a href="../C语言/q.html?id=${encodeURIComponent(q.id)}">${esc(q.title || q.id)}</a>
        <p>${esc(q.snippet || '')}</p>
      </div>
      <div class="wrow-actions"><button class="wbtn" type="button" data-remove-c="${esc(q.id)}">清除记录</button></div>
    </div>`;
  }
  function rowA(p){
    return `<div class="wrow">
      <div class="wrow-main">
        <div class="wrow-meta"><span>${esc(p.track || '算法')}</span><span class="dot"></span><span>${esc(p.difficulty || '')}</span></div>
        <a href="../算法/q.html?id=${encodeURIComponent(p.id)}">${esc(p.title || p.id)}</a>
        <p>${esc(p.excerpt || '')}</p>
      </div>
      <div class="wrow-actions"><button class="wbtn" type="button" data-remove-a="${esc(p.id)}">移出</button></div>
    </div>`;
  }

  function renderDetail(cat, cW, aW){
    const items = cat === 'c' ? cW : aW;
    const isC = cat === 'c';
    $('#detailKicker').textContent = isC ? 'WRONG BOOK / C 语言' : 'WRONG BOOK / ARENA';
    $('#detailTitle').textContent = isC ? `C 语言错题 · ${items.length} 道` : `算法错题 · ${items.length} 道`;
    $('#clearAll').disabled = items.length === 0;
    if (!items.length){
      $('#wlist').innerHTML = `<div class="empty">这一类还没有错题。${isC ? '答错单选题后会自动出现在这里。' : '在算法题目页点「加入错题本」后会出现在这里。'}</div>`;
      return;
    }
    if (isC){
      let html = '', lastYear = null;
      items.forEach(q => {
        if (q.year !== lastYear){ lastYear = q.year; html += `<div class="wgroup-label">${esc(q.year)} 年</div>`; }
        html += rowC(q);
      });
      $('#wlist').innerHTML = html;
    } else {
      const order = new Map(ARENA.tracks.map((t,i) => [t.name, i]));
      const groups = new Map();
      items.forEach(p => {
        const k = p.track || '其他';
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(p);
      });
      let html = '';
      [...groups.keys()].sort((a,b) => (order.has(a) ? order.get(a) : 99) - (order.has(b) ? order.get(b) : 99)).forEach(k => {
        html += `<div class="wgroup-label">${esc(k)} · ${groups.get(k).length} 道</div>`;
        html += groups.get(k).map(rowA).join('');
      });
      $('#wlist').innerHTML = html;
    }
  }

  function openCat(cat){
    activeCat = cat;
    document.querySelectorAll('.cat-card').forEach(el => {
      const on = el.dataset.cat === cat;
      el.classList.toggle('active', on);
      el.setAttribute('aria-expanded', on);
    });
    $('#detail').hidden = false;
    const cW = cWrongList(), aW = aWrongList();
    renderDetail(cat, cW, aW);
    $('#detail').scrollIntoView({behavior:'smooth', block:'start'});
  }

  document.querySelectorAll('.cat-card').forEach(el => {
    el.addEventListener('click', () => openCat(el.dataset.cat));
  });

  $('#wlist').addEventListener('click', (e) => {
    const cBtn = e.target.closest('[data-remove-c]');
    const aBtn = e.target.closest('[data-remove-a]');
    if (cBtn){
      const id = cBtn.dataset.removeC;
      delete cAns[id];
      save(C_ANS, cAns);
      try { localStorage.removeItem(C_CODE + id); } catch(err){}
      refresh();
      openCat('c');
      return;
    }
    if (aBtn){
      const id = aBtn.dataset.removeA;
      delete arena.wrong[id];
      save(ARENA_KEY, arena);
      refresh();
      openCat('a');
    }
  });

  $('#clearAll').addEventListener('click', () => {
    if (!activeCat) return;
    const label = activeCat === 'c' ? 'C 语言错题' : '算法错题';
    const msg = activeCat === 'c'
      ? `确定清空${label}吗？会同时删除这些题的选择记录，已写数量会减少。`
      : `确定清空${label}吗？只清空错题标记，已写数量不变。`;
    if (!confirm(msg)) return;
    if (activeCat === 'c'){
      cWrongList().forEach(q => { delete cAns[q.id]; try { localStorage.removeItem(C_CODE + q.id); } catch(err){} });
      save(C_ANS, cAns);
    } else {
      arena.wrong = {};
      save(ARENA_KEY, arena);
    }
    refresh();
    openCat(activeCat);
  });

  refresh();
  const hash = location.hash.replace('#','');
  if (hash === 'c' || hash === 'a') openCat(hash);
})();
</script>
</body>
