<style>
.hero-stats{display:flex;gap:44px;align-items:flex-end;flex-wrap:wrap;padding-bottom:6px}
.hero-stat .n{font-family:var(--serif);font-size:clamp(38px,5vw,64px);font-weight:700;line-height:1}
.hero-stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:10px}
.summary-line{font-size:12.5px;color:var(--ink-2);margin-top:24px;line-height:1.9;max-width:620px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.cat-card{display:flex;flex-direction:column;gap:16px;text-align:left;background:var(--paper-2);border:1px solid var(--line-2);padding:24px;cursor:pointer;transition:border-color .18s,transform .18s,background .18s;color:var(--ink);font:inherit}
.cat-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat-card.active{border-color:var(--ink);background:#fffef7}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cat-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted)}
.cat-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;margin-top:8px}
.cat-total{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.cat-count{display:flex;align-items:baseline;gap:7px}
.cat-count b{font-family:var(--serif);font-size:42px;line-height:1;font-weight:700}
.cat-count span{font-size:12px;color:var(--muted)}
.cat-split{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.cat-split b{color:var(--ink);font-size:13px}
.cat-bar{height:3px;background:var(--line);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.cat-open{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:13px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}
.cat-open span{color:var(--muted);letter-spacing:.04em}
.detail{margin-top:42px;border-top:1px solid var(--line-2);padding-top:26px;scroll-margin-top:80px}
.detail[hidden]{display:none}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.detail-head h2{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.3}
.detail-head .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.detail-head .detail-counts{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.detail-head .detail-counts b{color:var(--ink)}
.clear-all{background:none;border:1px solid var(--line-2);padding:8px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;color:var(--ink-2)}
.clear-all:hover{border-color:var(--ink);color:var(--ink)}
.clear-all:disabled{opacity:.4;cursor:default}
.wlist{margin-top:12px}
.wgroup{margin-top:8px}
.wgroup-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:22px 0 9px}
.wgroup-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.wgroup-count{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
.wgroup-hint{font-size:11.5px;color:var(--muted);margin:8px 0 2px;line-height:1.7}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.wrow-main{min-width:0}
.wrow-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:7px}
.wrow-meta .dot{width:3px;height:3px;background:var(--line-2);border-radius:50%}
.wrow-meta .review-stage{color:var(--ink-2);border:1px solid var(--line);padding:2px 6px}
.wrow-meta .hint-used{color:#8a4a35;border:1px solid #d9c1b6;padding:2px 6px}
.wrow a.wrow-title{font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.5}
.wrow a.wrow-title:hover{text-decoration:underline;text-underline-offset:3px}
.wrow p{margin:6px 0 0;font-size:11.5px;color:var(--ink-2);line-height:1.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrow-evidence{margin-top:7px;font-size:11.5px;color:var(--muted);line-height:1.7}

.wrow-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.wtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line);padding:2px 6px;background:var(--wash)}
.wrow-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-width:132px}
.wbtn{background:none;border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;cursor:pointer;color:var(--muted);white-space:nowrap}
.wbtn:hover{border-color:var(--ink);color:var(--ink)}
.wbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wbtn.primary:hover{background:#000;color:#fff}
.wbtn.danger{color:#8d5148}
.wbtn.danger:hover{border-color:#8d5148;color:#6f372f}
.empty{padding:40px 0;color:var(--muted);font-size:12px;line-height:1.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:12.5px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){
  .hero-stats{gap:30px}
  .cat-grid{grid-template-columns:1fr}

  .wrow-actions{flex-direction:row;flex-wrap:wrap;justify-content:flex-start;align-items:center}
  .wrow-actions .wbtn{flex:1 1 auto;text-align:center}

}
@media (min-width:821px){
  .hero-stat .n{font-size:58px}
  .hero-stat .l{font-size:12px}

  .cat-kicker{font-size:11.5px;letter-spacing:.14em}
  .cat-name{font-size:24px}
  .cat-total{font-size:11.5px}
  .cat-count span{font-size:13px}
  .cat-split{font-size:12px}
  .cat-open{font-size:11.5px;letter-spacing:.08em}
  .detail-head h2{font-size:27px}
  .detail-head .k{font-size:11.5px}
  .detail-counts{font-size:13px}
  .clear-all{font-size:11.5px}
  .wgroup-label,.wgroup-count{font-size:11.5px;letter-spacing:.1em}
  .wgroup-hint{font-size:13px}
  .wrow-meta{font-size:11.5px}
  .wrow a.wrow-title{font-size:16px}
  .wrow p,.wrow-evidence{font-size:13px}
  .wtag{font-size:11px}
  .wbtn{font-size:11.5px}
  .empty{font-size:13px}
}

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch(e){ return fallback; } };
  const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} };
  const DAY = 86400000;
  const REVIEW_KEY = 'mistakes.review.v1';
  const ARENA_KEY = 'arena.v1';
  const reviewAll = read(REVIEW_KEY, {});
  const hintAll = read('hint.ladder.v1', {});
  const arena = read(ARENA_KEY, { status:{}, book:{}, quiz:{}, lessons:{}, code:{}, wrong:{} });
  arena.wrong = arena.wrong || {};

  const CONTEST_TOTAL = 944;
  const LQ_TOTAL = 757;
  const A_TOTAL = 145;
  let aProblems = [];
  let aById = new Map();
  let lqList = [];
  let lqById = new Map();

  const banks = [
    { id:'c', name:'C 语言', kicker:'CONTEST / C', lang:'C', questions:null, ansKey:'cquiz.ans.v1', codePrefix:'cquiz.code.', href:'../problems/contest/q.html' },
    { id:'cpp', name:'C++', kicker:'CONTEST / C++', lang:'C++', questions:null, ansKey:'contest.ans.cpp.v1', codePrefix:'contest.code.cpp.', href:'../problems/contest/cpp/q.html' },
    { id:'java', name:'Java', kicker:'CONTEST / JAVA', lang:'Java', questions:null, ansKey:'contest.ans.java.v1', codePrefix:'contest.code.java.', href:'../problems/contest/java/q.html' },
    { id:'python', name:'Python', kicker:'CONTEST / PYTHON', lang:'Python', questions:null, ansKey:'contest.ans.python.v1', codePrefix:'contest.code.python.', href:'../problems/contest/python/q.html' }
  ].map(b => ({ ...b, total:0, ans:read(b.ansKey, {}) }));
  const bankMap = new Map(banks.map(b => [b.id, b]));

  const categories = [
    { id:'contest', name:'计算机挑战赛', kicker:'WRONG BOOK / CONTEST', total:CONTEST_TOTAL },
    { id:'lq', name:'蓝桥杯', kicker:'WRONG BOOK / LANQIAO', total:LQ_TOTAL },
    { id:'a', name:'算法题库', kicker:'WRONG BOOK / ARENA', total:A_TOTAL }
  ];

  function wrongList(bank){
    return (bank.questions || []).filter(q => q.kind === 'single' && bank.ans[q.id] && bank.ans[q.id].ok === false);
  }
  function lqWrong(){
    const obj = read('lq.wrong', {});
    return Object.keys(obj).map(id => Object.assign({ id }, lqById.get(id) || {}, obj[id] || {}))
      .filter(p => p && p.title);
  }
  function arenaWrong(){ return aProblems.filter(p => arena.wrong[p.id]); }

  /* 错题数据按分类懒加载：先出卡片和计数，点开某类再下题库。 */
  const loaded = { contest:false, lq:false, a:false };
  const loading = {};
  const DATA_SRC = {
    contest: ['../problems/contest/data.js', '../problems/contest/cpp/data.js', '../problems/contest/java/data.js', '../problems/contest/python/data.js'],
    lq: ['../problems/lanqiao/data/catalog.js'],
    a: ['../problems/algorithm/assets/app_data.js']
  };
  function loadScript(src){
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('加载失败：' + src));
      document.head.appendChild(s);
    });
  }
  function attachData(catId){
    if (catId === 'contest') {
      const packs = [window.CDATA, window.CDATA_CPP, window.CDATA_JAVA, window.CDATA_PY];
      banks.forEach((b, i) => {
        b.questions = (packs[i] && packs[i].questions) || [];
        b.byId = new Map(b.questions.map(q => [q.id, q]));
        b.total = b.questions.length;
      });
      const cat = categories.find(c => c.id === 'contest');
      if (cat) cat.total = banks.reduce((n, b) => n + b.total, 0) || cat.total;
    } else if (catId === 'lq') {
      lqList = (window.LQ_CATALOG && LQ_CATALOG.problems) ? LQ_CATALOG.problems : [];
      lqById = new Map(lqList.map(p => [p.id, p]));
      const cat = categories.find(c => c.id === 'lq');
      if (cat) cat.total = lqList.length || cat.total;
    } else {
      aProblems = (window.ARENA && ARENA.problems) ? ARENA.problems : [];
      aById = new Map(aProblems.map(p => [p.id, p]));
      const cat = categories.find(c => c.id === 'a');
      if (cat) cat.total = aProblems.length || cat.total;
    }
    loaded[catId] = true;
  }
  function ensureData(catId){
    if (loaded[catId]) return Promise.resolve();
    if (loading[catId]) return loading[catId];
    loading[catId] = Promise.all((DATA_SRC[catId] || []).map(loadScript)).then(() => {
      attachData(catId);
    }).catch((err) => {
      loading[catId] = null;
      throw err;
    });
    return loading[catId];
  }
  function wrongKeys(catId){
    if (catId === 'contest') {
      const keys = [];
      banks.forEach(b => {
        b.ans = read(b.ansKey, {});
        Object.keys(b.ans).forEach(id => {
          const rec = b.ans[id];
          if (rec && rec.ok === false) keys.push(reviewKey('contest', b.id, id));
        });
      });
      return keys;
    }
    if (catId === 'lq') return Object.keys(read('lq.wrong', {})).map(id => reviewKey('lq', '', id));
    return Object.keys(arena.wrong).filter(id => arena.wrong[id]).map(id => reviewKey('a', '', id));
  }
  function statsFor(catId){
    const keys = wrongKeys(catId);
    return {
      count: keys.length,
      due: keys.filter(k => statusOf(k) === 'due').length,
      later: keys.filter(k => statusOf(k) === 'later').length,
      mastered: keys.filter(k => statusOf(k) === 'mastered').length
    };
  }
  function buildItems(catId){
    if (catId === 'contest') {
      const items = [];
      banks.forEach(b => {
        b.ans = read(b.ansKey, {});
        wrongList(b).forEach(q => items.push(contestItem(b, q)));
      });
      return items;
    }
    if (catId === 'lq') return lqWrong().map(lqItem);
    return arenaWrong().map(algoItem);
  }

  function reviewKey(catId, bankId, id){ return catId + ':' + (bankId || '') + ':' + id; }
  function reviewOf(key){
    const r = reviewAll[key] || {};
    return { stage:Number(r.stage || 0), due:Number(r.due || 0), last:Number(r.last || 0), mastered:!!r.mastered };
  }
  function statusOf(key){
    const r = reviewOf(key);
    if (r.mastered) return 'mastered';
    if (r.due && r.due > Date.now()) return 'later';
    return 'due';
  }
  function dueText(key){
    const r = reviewOf(key);
    if (r.mastered) return '已掌握';
    if (r.due && r.due > Date.now()) {
      const days = Math.max(1, Math.ceil((r.due - Date.now()) / DAY));
      return days + ' 天后';
    }
    return '今天';
  }
  function stageText(key){
    const r = reviewOf(key);
    if (r.mastered) return '已掌握';
    if (r.stage <= 0) return '新错题 · 今天';
    return '复习 ' + r.stage + '/3 · ' + dueText(key);
  }
  function hintText(key){
    if (!key) return '';
    const lvl = Number(hintAll[key] || 0);
    if (!lvl) return '';
    return '用过提示 L' + Math.min(3, lvl);
  }

  function setReview(key, action){
    const r = reviewOf(key);
    if (action === 'master'){
      if (r.mastered) return;
      if (r.stage >= 3) {
        r.mastered = true;
        r.due = 0;
      } else {
        const days = [1, 3, 7][r.stage] || 7;
        r.stage += 1;
        r.due = Date.now() + days * DAY;
      }
    } else if (action === 'again') {
      r.mastered = false;
      r.stage = 0;
      r.due = Date.now();
    } else if (action === 'reset') {
      r.mastered = false;
      r.stage = 0;
      r.due = Date.now();
    } else if (action === 'seen') {
      r.last = Date.now();
    }
    reviewAll[key] = r;
    save(REVIEW_KEY, reviewAll);
    return r;
  }
  function clearReviews(keys){
    keys.forEach(k => { delete reviewAll[k]; });
    save(REVIEW_KEY, reviewAll);
  }

  function guessConcept(text){
    const pairs = [
      [/值传递|引用传递/, '参数传递'],
      [/虚函数|多态/, '虚函数与多态'],
      [/构造|析构/, '构造与析构'],
      [/继承/, '继承与派生'],
      [/重载/, '函数重载'],
      [/模板/, '模板'],
      [/指针/, '指针'],
      [/引用/, '引用'],
      [/异常/, '异常处理'],
      [/文件/, '文件操作'],
      [/字符串|string/i, '字符串'],
      [/排序/, '排序'],
      [/查找/, '查找'],
      [/递归/, '递归'],
      [/动态规划|DP/i, '动态规划'],
      [/贪心/, '贪心'],
      [/图|树/, '图与树']
    ];
    const hit = pairs.find(pair => pair[0].test(text || ''));
    return hit ? hit[1] : '';
  }
  function conceptOf(item){
    if (item.catId === 'contest') {
      const m = String(item.q.expl || '').match(/^考点[：:]\s*([^。；]+)/);
      if (m) return { label:'考点', text:m[1].trim() };
      const guess = guessConcept(item.snippet);
      return guess ? { label:'可能考点', text:guess } : null;
    }
    if (item.catId === 'a' && item.raw.track) return { label:'分类', text:item.raw.track };
    return null;
  }

  function contestItem(bank, q){
    const rec = bank.ans[q.id] || {};
    const key = reviewKey('contest', bank.id, q.id);
    return {
      catId:'contest', bankId:bank.id, id:q.id, key,
      hintKey:'contest:' + bank.lang + ':' + q.id,
      title:q.kind === 'single' ? ('单选题 ' + q.no) : (q.title || q.id),
      href:bank.href + '?id=' + encodeURIComponent(q.id),
      meta:[bank.name, q.year + ' 年', '第 ' + q.no + ' 题'],
      snippet:q.snippet || '',
      evidence:rec.k && q.answer ? ('上次选 ' + rec.k + ' · 正确答案 ' + q.answer) : '',
      q
    };
  }
  function lqItem(p){
    const key = reviewKey('lq', '', p.id);
    return {
      catId:'lq', bankId:'', id:p.id, key,
      title:p.title || p.id,
      href:'../problems/lanqiao/problem.html?id=' + encodeURIComponent(p.id),
      meta:[p.year || '未标注年份', (p.tracks || []).join(' / ') || '蓝桥杯', p.src === 'luogu' ? '洛谷' : 'Dotcpp'],
      snippet:p.excerpt || '',
      evidence:'手动加入 · 对照题解重做',
      raw:p
    };
  }
  function algoItem(p){
    const key = reviewKey('a', '', p.id);
    return {
      catId:'a', bankId:'', id:p.id, key,
      hintKey:'algorithm:' + p.id,
      title:p.title || p.id,
      href:'../problems/algorithm/q.html?id=' + encodeURIComponent(p.id),
      meta:[p.track || '算法', p.difficulty || ''].filter(Boolean),
      snippet:p.excerpt || '',
      evidence:'手动加入 · 先自己推，再看题解',
      raw:p
    };
  }

  let activeCat = '';
  let stats = {};

  function refresh(){
    stats = {};
    categories.forEach(cat => { stats[cat.id] = statsFor(cat.id); });
    const totalWrong = categories.reduce((n,c) => n + stats[c.id].count, 0);
    const due = categories.reduce((n,c) => n + stats[c.id].due, 0);
    const mastered = categories.reduce((n,c) => n + stats[c.id].mastered, 0);
    $('#totalWrong').textContent = totalWrong;
    $('#dueToday').textContent = due;
    $('#masteredCount').textContent = mastered;
    $('#summaryLine').textContent = totalWrong
      ? `今天有 ${due} 道到期；做完后点“记住了”，会按 1 / 3 / 7 天继续排。已掌握 ${mastered} 道。`
      : '还没有错题。答错单选题，或在蓝桥、算法题页点“加入错题本”，就会出现在这里。';
    renderCards();
    if (activeCat) {
      if (loaded[activeCat]) renderDetail(activeCat);
      else renderDetailLoading(activeCat);
    }
  }

  function card(cat){
    const c = stats[cat.id] || { count:0, due:0, later:0, mastered:0 };
    const pct = c.count ? Math.min(100, c.mastered / c.count * 100) : 0;
    return `<button class="cat-card${activeCat === cat.id ? ' active' : ''}" type="button" data-cat="${cat.id}" aria-controls="detail" aria-expanded="${activeCat === cat.id}">
      <div class="cat-top"><div><div class="cat-kicker">${esc(cat.kicker)}</div><div class="cat-name">${esc(cat.name)}</div></div>
        <span class="cat-total">题库 ${cat.total}</span></div>
      <div class="cat-count"><b>${c.count}</b><span>道错题</span></div>
      <div class="cat-split"><span>今天 <b>${c.due}</b></span><span>稍后 <b>${c.later}</b></span><span>已掌握 <b>${c.mastered}</b></span></div>
      <div class="cat-bar"><i style="width:${pct}%"></i></div>
      <div class="cat-open">进入复习 <span>点开 →</span></div>
    </button>`;
  }
  function renderCards(){
    $('#catGrid').innerHTML = categories.map(card).join('');
    document.querySelectorAll('.cat-card').forEach(el => el.addEventListener('click', () => openCat(el.dataset.cat, true)));
  }

  function row(item){
    const status = statusOf(item.key);
    const stage = stageText(item.key);
    const hint = hintText(item.hintKey || '');
    const concept = conceptOf(item);
    const tags = [
      concept ? `<span class="wtag">${esc(concept.label)} · ${esc(concept.text)}</span>` : '',
      hint ? `<span class="wtag">${esc(hint)}</span>` : '',
      status === 'mastered' ? `<span class="wtag">已掌握</span>` : ''
    ].filter(Boolean).join('');
    const actions = status === 'mastered'
      ? `<a class="wbtn primary" href="${item.href}" data-review-go="${esc(item.key)}">再复习</a>
         <button class="wbtn" type="button" data-review-reset="${esc(item.key)}">重新排期</button>
         <button class="wbtn danger" type="button" data-remove="${esc(item.key)}">移出</button>`
      : `<a class="wbtn primary" href="${item.href}" data-review-go="${esc(item.key)}">重做</a>
         <button class="wbtn" type="button" data-review-master="${esc(item.key)}">做完了，记住了</button>
         <button class="wbtn" type="button" data-review-again="${esc(item.key)}">还没懂</button>
         <button class="wbtn danger" type="button" data-remove="${esc(item.key)}">移出</button>`;
    return `<div class="wrow" data-row="${esc(item.key)}">
      <div class="wrow-main">
        <div class="wrow-meta">${item.meta.map(x => `<span>${esc(x)}</span>`).join('<span class="dot"></span>')}
          <span class="dot"></span><span class="review-stage">${esc(stage)}</span></div>
        <a class="wrow-title" href="${item.href}" data-review-go="${esc(item.key)}">${esc(item.title)}</a>
        ${item.snippet ? `<p>${esc(item.snippet)}</p>` : ''}
        ${item.evidence ? `<div class="wrow-evidence">${esc(item.evidence)}</div>` : ''}
        ${tags ? `<div class="wrow-tags">${tags}</div>` : ''}
      </div>
      <div class="wrow-actions">${actions}</div>
    </div>`;
  }

  function renderDetail(catId){
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    const items = buildItems(catId);
    const s = stats[catId] || statsFor(catId);
    $('#detailKicker').textContent = cat.kicker;
    $('#detailTitle').textContent = cat.name + '错题复习 · ' + items.length + ' 道';
    $('#detailCounts').innerHTML = `<span>今天 <b>${s.due}</b></span><span>稍后 <b>${s.later}</b></span><span>已掌握 <b>${s.mastered}</b></span>`;
    $('#clearAll').disabled = !items.length;
    if (!items.length){
      const hint = catId === 'lq' ? '在蓝桥题目页点“加入错题本”后会出现在这里。' : (catId === 'a' ? '在算法题目页点“加入错题本”后会出现在这里。' : '答错单选题后会自动出现在这里。');
      $('#wlist').innerHTML = `<div class="empty">这一类还没有错题。${hint}</div>`;
      return;
    }
    const groups = [
      { id:'due', label:'今天该复习', note:'先不看答案，重做一遍；做完再决定是否标记已会。' },
      { id:'later', label:'稍后复习', note:'还没到期，可以先放一放；想提前做也可以点“重做”。' },
      { id:'mastered', label:'已掌握', note:'保留在这里方便回看；如果又忘了，点“重新排期”回到今天。' }
    ];
    const html = groups.map(g => {
      const list = items.filter(x => statusOf(x.key) === g.id)
        .sort((a,b) => {
          if (g.id === 'later') return reviewOf(a.key).due - reviewOf(b.key).due;
          if (g.id === 'mastered') return reviewOf(b.key).last - reviewOf(a.key).last;
          return String(a.catId).localeCompare(String(b.catId)) || String(a.id).localeCompare(String(b.id));
        });
      if (!list.length) return '';
      return `<div class="wgroup"><div class="wgroup-head"><span class="wgroup-label">${esc(g.label)}</span><span class="wgroup-count">${list.length} 道</span></div><p class="wgroup-hint">${esc(g.note)}</p>${list.map(row).join('')}</div>`;
    }).join('');
    $('#wlist').innerHTML = html;
  }

  function renderDetailLoading(catId){
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    const s = stats[catId] || { due:0, later:0, mastered:0 };
    $('#detailKicker').textContent = cat.kicker;
    $('#detailTitle').textContent = cat.name + '错题复习';
    $('#detailCounts').innerHTML = `<span>今天 <b>${s.due}</b></span><span>稍后 <b>${s.later}</b></span><span>已掌握 <b>${s.mastered}</b></span>`;
    $('#clearAll').disabled = true;
    $('#wlist').innerHTML = `<div class="empty">正在加载这一类错题…<br><span style="color:var(--muted)">只加载你点开的分类，不会一次把三套题库全下载。</span></div>`;
  }

  function openCat(catId, scroll){
    activeCat = catId;
    renderCards();
    $('#detail').hidden = false;
    if (loaded[catId]) {
      renderDetail(catId);
    } else {
      renderDetailLoading(catId);
      ensureData(catId).then(() => {
        renderCards();
        if (activeCat === catId) renderDetail(catId);
      }).catch(() => {
        if (activeCat === catId) $('#wlist').innerHTML = '<div class="empty">题库加载失败。检查网络后刷新页面再试。</div>';
      });
    }
    if (scroll) $('#detail').scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function toast(msg){
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 2200);
  }

  $('#wlist').addEventListener('click', (e) => {
    const master = e.target.closest('[data-review-master]');
    const again = e.target.closest('[data-review-again]');
    const reset = e.target.closest('[data-review-reset]');
    const remove = e.target.closest('[data-remove]');
    if (master) {
      const key = master.getAttribute('data-review-master');
      const r = setReview(key, 'master');
      refresh();
      if (r.mastered) toast('已标为掌握。');
      else toast('已记录，下次复习：' + dueText(key));
      return;
    }
    if (again) {
      setReview(again.getAttribute('data-review-again'), 'again');
      refresh();
      toast('已放回今天，先别急，再看一遍题面或提示。');
      return;
    }
    if (reset) {
      setReview(reset.getAttribute('data-review-reset'), 'reset');
      refresh();
      toast('已重新排到今天。');
      return;
    }
    if (remove) {
      removeItem(remove.getAttribute('data-remove'));
      refresh();
      toast('已移出错题本。');
    }
  });

  $('#wlist').addEventListener('click', (e) => {
    const go = e.target.closest('[data-review-go]');
    if (!go) return;
    setReview(go.getAttribute('data-review-go'), 'seen');
  });

  function removeItem(key){
    const parts = key.split(':');
    const catId = parts[0];
    if (catId === 'contest') {
      const b = bankMap.get(parts[1]);
      const id = parts.slice(2).join(':');
      if (b) { delete b.ans[id]; save(b.ansKey, b.ans); try { localStorage.removeItem(b.codePrefix + id); } catch(err){} }
    } else if (catId === 'lq') {
      const id = parts.slice(2).join(':');
      const wrong = read('lq.wrong', {});
      delete wrong[id];
      save('lq.wrong', wrong);
    } else if (catId === 'a') {
      const id = parts.slice(2).join(':');
      delete arena.wrong[id];
      save(ARENA_KEY, arena);
    }
    delete reviewAll[key];
    save(REVIEW_KEY, reviewAll);
  }

  $('#clearAll').addEventListener('click', () => {
    if (!activeCat) return;
    const cat = categories.find(c => c.id === activeCat);
    const items = loaded[activeCat] ? buildItems(activeCat) : [];
    if (!cat || !items.length) return;
    if (!confirm(`确定清空${cat.name}错题吗？复习进度也会一起清掉。`)) return;
    clearReviews(items.map(x => x.key));
    if (activeCat === 'contest') {
      banks.forEach(b => {
        wrongList(b).forEach(q => {
          delete b.ans[q.id];
          try { localStorage.removeItem(b.codePrefix + q.id); } catch(err){}
        });
        save(b.ansKey, b.ans);
      });
    } else if (activeCat === 'lq') {
      save('lq.wrong', {});
    } else {
      arena.wrong = {};
      save(ARENA_KEY, arena);
    }
    refresh(); openCat(activeCat);
  });

  refresh();
  const hash = location.hash.replace('#','');
  if (hash === 'contest' || hash === 'c' || hash === 'cpp' || hash === 'java' || hash === 'python') openCat('contest', false);
  else if (hash === 'lq' || hash === 'lanqiao') openCat('lq', false);
  else if (hash === 'a') openCat('a', false);
})();
</script>
    <script src="../assets/js/site.js" defer></script>
