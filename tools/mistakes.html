<style>
.hero-stats{display:flex;gap:44px;align-items:flex-end;flex-wrap:wrap;padding-bottom:6px}
.hero-stat .n{font-family:var(--serif);font-size:clamp(38px,5vw,64px);font-weight:700;line-height:1}
.hero-stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:10px}
.summary-line{font-size:12.5px;color:var(--ink-2);margin-top:24px;line-height:1.9}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
.cat-card{display:flex;flex-direction:column;gap:18px;text-align:left;background:var(--paper-2);border:1px solid var(--line-2);padding:25px 24px 22px;cursor:pointer;transition:border-color .18s,transform .18s,background .18s;color:var(--ink);font:inherit}
.cat-card:hover{border-color:var(--ink);transform:translateY(-2px)}
.cat-card.active{border-color:var(--ink);background:#fffef7}
.cat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cat-kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--muted)}
.cat-name{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.25;margin-top:8px}
.cat-total{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.cat-progress{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cat-progress b{font-family:var(--serif);font-size:42px;line-height:1;font-weight:700}
.cat-progress span{font-size:12px;color:var(--muted)}
.cat-wrong{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.cat-wrong b{color:var(--ink);font-size:13px}
.cat-bar{height:3px;background:var(--line);overflow:hidden}
.cat-bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.cat-open{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:13px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink)}
.cat-open span{color:var(--muted);letter-spacing:.04em}
.detail{margin-top:42px;border-top:1px solid var(--line-2);padding-top:26px;scroll-margin-top:80px}
.detail[hidden]{display:none}
.detail-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:8px}
.detail-head h2{font-family:var(--serif);font-size:30px;font-weight:700;line-height:1.3}
.detail-head .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.clear-all{background:none;border:1px solid var(--line-2);padding:8px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;cursor:pointer;color:var(--ink-2)}
.clear-all:hover{border-color:var(--ink);color:var(--ink)}
.clear-all:disabled{opacity:.4;cursor:default}
.wlist{margin-top:12px}
.wgroup-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);padding:22px 0 8px;border-bottom:1px solid var(--line)}
.wrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.wrow-main{min-width:0}
.wrow-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.wrow-meta .dot{width:3px;height:3px;background:var(--line-2);border-radius:50%}
.wrow a{font-size:15.5px;font-weight:600;color:var(--ink);text-decoration:none;line-height:1.5}
.wrow a:hover{text-decoration:underline;text-underline-offset:3px}
.wrow p{font-size:11.5px;color:var(--ink-2);margin:5px 0 0;line-height:1.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wrow-actions{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.wbtn{background:none;border:1px solid var(--line);padding:6px 10px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;cursor:pointer;color:var(--muted);white-space:nowrap}
.wbtn:hover{border-color:var(--ink);color:var(--ink)}
.empty{padding:40px 0;color:var(--muted);font-size:12px}
.panel-hint{padding:28px 0 8px;color:var(--muted);font-size:12px}
@media(max-width:820px){
  .hero-stats{gap:30px}
  .cat-grid{grid-template-columns:1fr}
  .cat-progress b{font-size:36px}
  .wrow{grid-template-columns:1fr}
  .wrow-actions{flex-direction:row;justify-content:flex-start}
  .detail-head h2{font-size:24px}
}

/* ---------- 阅读性微调（桌面） ---------- */
@media (min-width: 821px){
  .hero-stat .n{font-size:58px}
  .hero-stat .l{font-size:12px}
  .summary-line{font-size:13.5px}
  .cat-kicker{font-size:11.5px;letter-spacing:.14em}
  .cat-name{font-size:24px}
  .cat-total{font-size:11.5px}
  .cat-progress span{font-size:13px}
  .cat-wrong{font-size:12px}
  .cat-open{font-size:11.5px;letter-spacing:.08em}
  .detail-head h2{font-size:27px}
  .detail-head .k{font-size:11.5px}
  .clear-all{font-size:11.5px}
  .wgroup-label{font-size:11.5px;letter-spacing:.1em}
  .wrow-meta{font-size:11.5px;letter-spacing:.04em}
  .wrow a{font-size:16px}
  .wrow p{font-size:13px}
  .wbtn{font-size:11.5px}
  .empty,.panel-hint{font-size:13px}
}
</style>

<script>
(function(){
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const read = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key) || '{}') || fallback; } catch(e){ return fallback; } };
  const save = (key, val) => { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} };
  const ARENA_KEY = 'arena.v1';
  const arena = read(ARENA_KEY, { status:{}, book:{}, quiz:{}, lessons:{}, code:{}, wrong:{} });
  arena.status = arena.status || {}; arena.quiz = arena.quiz || {}; arena.code = arena.code || {}; arena.wrong = arena.wrong || {};
  const aProblems = (window.ARENA && ARENA.problems) ? ARENA.problems : [];
  const aById = new Map(aProblems.map(p => [p.id, p]));

  const banks = [
    { id:'c', name:'C 语言', kicker:'CONTEST / C', total:236, questions: (window.CDATA && CDATA.questions) || [], ansKey:'cquiz.ans.v1', codePrefix:'cquiz.code.', href:'../problems/contest/q.html' },
    { id:'cpp', name:'C++', kicker:'CONTEST / C++', total:235, questions: (window.CDATA_CPP && CDATA_CPP.questions) || [], ansKey:'contest.ans.cpp.v1', codePrefix:'contest.code.cpp.', href:'../problems/contest/cpp/q.html' },
    { id:'java', name:'Java', kicker:'CONTEST / JAVA', total:238, questions: (window.CDATA_JAVA && CDATA_JAVA.questions) || [], ansKey:'contest.ans.java.v1', codePrefix:'contest.code.java.', href:'../problems/contest/java/q.html' },
    { id:'python', name:'Python', kicker:'CONTEST / PYTHON', total:235, questions: (window.CDATA_PY && CDATA_PY.questions) || [], ansKey:'contest.ans.python.v1', codePrefix:'contest.code.python.', href:'../problems/contest/python/q.html' }
  ].map(b => ({ ...b, byId: new Map(b.questions.map(q => [q.id, q])), total: b.questions.length || b.total, ans: read(b.ansKey, {}) }));
  const bankMap = new Map(banks.map(b => [b.id, b]));
  const algo = { id:'a', name:'算法题库', kicker:'WRONG BOOK / ARENA', total:aProblems.length || 145, questions:aProblems, byId:aById, href:'../problems/algorithm/q.html' };

  const lqList = (window.LQ_CATALOG && LQ_CATALOG.problems) ? LQ_CATALOG.problems : [];
  const lqById = new Map(lqList.map(p => [p.id, p]));
  const lanqiao = { id:'lq', name:'蓝桥杯', kicker:'WRONG BOOK / LANQIAO', total:lqList.length || 757, href:'../problems/lanqiao/problem.html' };
  const contest = { id:'contest', name:'计算机挑战赛', kicker:'WRONG BOOK / CONTEST', total:banks.reduce((n, b) => n + b.total, 0), banks };
  const categories = [contest, lanqiao, algo];

  function writtenSet(bank){
    const set = new Set();
    Object.keys(bank.ans).forEach(id => { if (bank.byId.has(id)) set.add(id); });
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(bank.codePrefix)) continue;
      const id = k.slice(bank.codePrefix.length);
      if (bank.byId.has(id) && (localStorage.getItem(k) || '').trim()) set.add(id);
    }
    return set;
  }
  function arenaWrittenSet(){
    const set = new Set();
    ['status','quiz','code'].forEach(k => {
      Object.keys(arena[k] || {}).forEach(id => {
        if (!aById.has(id)) return;
        if (k === 'status' && (!arena[k][id] || arena[k][id] === 'todo')) return;
        set.add(id);
      });
    });
    return set;
  }
  function lqWrittenSet(){
    const set = new Set();
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith('lq.code.')) continue;
      const id = k.slice(8).split('.')[0];
      if (lqById.has(id) && (localStorage.getItem(k) || '').trim()) set.add(id);
    }
    return set;
  }
  function wrongList(bank){
    return bank.questions.filter(q => q.kind === 'single' && bank.ans[q.id] && bank.ans[q.id].ok === false)
      .sort((a,b) => Number(b.year) - Number(a.year) || Number(a.no) - Number(b.no));
  }
  function arenaWrong(){ return aProblems.filter(p => arena.wrong[p.id]); }
  function lqWrongItems(){
    const obj = read('lq.wrong', {});
    return Object.keys(obj).map(id => Object.assign({ id }, lqById.get(id) || {}, obj[id] || {}))
      .filter(p => p && p.title)
      .sort((a,b) => String(b.year || '').localeCompare(String(a.year || '')));
  }

  let activeCat = '';
  let cache = {};

  function refresh(){
    cache = {};
    let cWritten = 0, cWrong = [];
    banks.forEach(b => {
      b.ans = read(b.ansKey, {});
      const w = writtenSet(b), wrong = wrongList(b);
      cWritten += w.size;
      wrong.forEach(q => cWrong.push({ q, bank:b }));
      cache[b.id] = { written:w.size, wrong };
    });
    cache.contest = { written:cWritten, wrong:cWrong };
    const lw = lqWrittenSet(), lW = lqWrongItems();
    cache.lq = { written:lw.size, wrong:lW };
    const aw = arenaWrittenSet(), aW = arenaWrong();
    cache.a = { written:aw.size, wrong:aW };

    const totalAll = categories.reduce((n,c) => n + c.total, 0);
    const writtenAll = cache.contest.written + cache.lq.written + cache.a.written;
    const wrongAll = cache.contest.wrong.length + cache.lq.wrong.length + cache.a.wrong.length;
    $('#totalQ').textContent = totalAll;
    $('#totalWritten').textContent = writtenAll;
    $('#totalWrong').textContent = wrongAll;
    $('#summaryLine').textContent = `一共 ${totalAll} 题，已写 ${writtenAll} 题，错题 ${wrongAll} 道；按计算机挑战赛、蓝桥杯与算法题库分类，点开就能看到具体题目。`;
    renderCards();
    if (activeCat) renderDetail(activeCat);
  }

  function card(cat){
    const c = cache[cat.id] || { written:0, wrong:[] };
    const pct = cat.total ? Math.min(100, c.written / cat.total * 100) : 0;
    return `<button class="cat-card${activeCat === cat.id ? ' active' : ''}" type="button" data-cat="${cat.id}" aria-controls="detail" aria-expanded="${activeCat === cat.id}">
      <div class="cat-top"><div><div class="cat-kicker">${esc(cat.kicker)}</div><div class="cat-name">${esc(cat.name)}</div></div>
        <span class="cat-total"><span>${cat.total}</span> 题</span></div>
      <div class="cat-progress"><b>${c.written}</b><span>/ ${cat.total} 已写</span><span class="cat-wrong"><b>${c.wrong.length}</b> 道错题</span></div>
      <div class="cat-bar"><i style="width:${pct}%"></i></div>
      <div class="cat-open">查看 ${esc(cat.name)} 错题 <span>点开 →</span></div>
    </button>`;
  }
  function renderCards(){
    $('#catGrid').innerHTML = categories.map(card).join('');
    document.querySelectorAll('.cat-card').forEach(el => el.addEventListener('click', () => openCat(el.dataset.cat, true)));
  }

  function rowC(q, bank){
    return `<div class="wrow">
      <div class="wrow-main">
        <div class="wrow-meta"><span>${esc(q.year)} 年</span><span class="dot"></span><span>${esc(bank.name)} · 第 ${esc(q.no)} 题</span></div>
        <a href="${bank.href}?id=${encodeURIComponent(q.id)}">${esc(q.title || q.id)}</a>
        ${q.snippet && q.snippet !== q.title ? `<p>${esc(q.snippet)}</p>` : ''}
      </div>
      <div class="wrow-actions"><button class="wbtn" type="button" data-remove-c="${bank.id}" data-id="${esc(q.id)}">清除记录</button></div>
    </div>`;
  }
  function rowA(p){
    return `<div class="wrow">
      <div class="wrow-main">
        <div class="wrow-meta"><span>${esc(p.track || '算法')}</span><span class="dot"></span><span>${esc(p.difficulty || '')}</span></div>
        <a href="../problems/algorithm/q.html?id=${encodeURIComponent(p.id)}">${esc(p.title || p.id)}</a>
        <p>${esc(p.excerpt || '')}</p>
      </div>
      <div class="wrow-actions"><button class="wbtn" type="button" data-remove-a="${esc(p.id)}">移出</button></div>
    </div>`;
  }
  function rowLQ(p){
    return `<div class="wrow">
      <div class="wrow-main">
        <div class="wrow-meta"><span>${esc(p.year || '')}</span><span class="dot"></span><span>${esc((p.tracks || []).join(' / ') || '蓝桥杯')}</span><span class="dot"></span><span>${p.src === 'luogu' ? '洛谷' : 'Dotcpp'}</span></div>
        <a href="../problems/lanqiao/problem.html?id=${encodeURIComponent(p.id)}">${esc(p.title || p.id)}</a>
        <p>${esc(p.excerpt || '')}</p>
      </div>
      <div class="wrow-actions"><button class="wbtn" type="button" data-remove-lq="${esc(p.id)}">移出</button></div>
    </div>`;
  }

  function renderDetail(catId){
    const cat = categories.find(c => c.id === catId);
    if (!cat) return;
    const c = cache[catId] || { wrong:[] };
    const items = c.wrong;
    $('#detailKicker').textContent = cat.kicker;
    $('#detailTitle').textContent = `${cat.name}错题 · ${items.length} 道`;
    $('#clearAll').disabled = items.length === 0;
    if (!items.length){
      const hint = catId === 'lq' ? '在蓝桥题目页点「加入错题本」后会出现在这里。' : (catId === 'a' ? '在算法题目页点「加入错题本」后会出现在这里。' : '答错单选题后会自动出现在这里。');
      $('#wlist').innerHTML = `<div class="empty">这一类还没有错题。${hint}</div>`;
      return;
    }
    if (catId === 'contest'){
      let html = '';
      banks.forEach(b => {
        const list = wrongList(b);
        if (!list.length) return;
        html += `<div class="wgroup-label">${esc(b.name)} · ${list.length} 道</div>`;
        html += list.map(q => rowC(q, b)).join('');
      });
      $('#wlist').innerHTML = html;
      return;
    }
    if (catId === 'lq'){
      let html = '', lastYear = null;
      items.forEach(p => {
        if (p.year !== lastYear){ lastYear = p.year; html += `<div class="wgroup-label">${esc(p.year || '未标注年份')} · 蓝桥杯</div>`; }
        html += rowLQ(p);
      });
      $('#wlist').innerHTML = html;
      return;
    }
    const order = new Map((ARENA.tracks || []).map((t,i) => [t.name, i]));
    const groups = new Map();
    items.forEach(p => { const k = p.track || '其他'; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(p); });
    let html = '';
    [...groups.keys()].sort((a,b) => (order.has(a) ? order.get(a) : 99) - (order.has(b) ? order.get(b) : 99)).forEach(k => {
      html += `<div class="wgroup-label">${esc(k)} · ${groups.get(k).length} 道</div>`;
      html += groups.get(k).map(rowA).join('');
    });
    $('#wlist').innerHTML = html;
  }

  function openCat(catId, scroll){
    activeCat = catId;
    renderCards();
    $('#detail').hidden = false;
    renderDetail(catId);
    if (scroll) $('#detail').scrollIntoView({behavior:'smooth', block:'start'});
  }

  $('#wlist').addEventListener('click', (e) => {
    const cBtn = e.target.closest('[data-remove-c]');
    const aBtn = e.target.closest('[data-remove-a]');
    const lBtn = e.target.closest('[data-remove-lq]');
    if (cBtn){
      const bank = bankMap.get(cBtn.dataset.removeC);
      if (!bank) return;
      const id = cBtn.dataset.id;
      delete bank.ans[id];
      save(bank.ansKey, bank.ans);
      try { localStorage.removeItem(bank.codePrefix + id); } catch(err){}
      refresh(); openCat('contest');
      return;
    }
    if (lBtn){
      const wrong = read('lq.wrong', {});
      delete wrong[lBtn.dataset.removeLq];
      save('lq.wrong', wrong);
      refresh(); openCat('lq');
      return;
    }
    if (aBtn){
      delete arena.wrong[aBtn.dataset.removeA];
      save(ARENA_KEY, arena);
      refresh(); openCat('a');
    }
  });

  $('#clearAll').addEventListener('click', () => {
    if (!activeCat) return;
    const cat = categories.find(c => c.id === activeCat);
    if (!cat) return;
    if (!confirm(`确定清空${cat.name}错题吗？`)) return;
    if (activeCat === 'contest'){
      banks.forEach(bank => {
        wrongList(bank).forEach(q => {
          delete bank.ans[q.id];
          try { localStorage.removeItem(bank.codePrefix + q.id); } catch(err){}
        });
        save(bank.ansKey, bank.ans);
      });
    } else if (activeCat === 'lq'){
      save('lq.wrong', {});
    } else {
      arena.wrong = {};
      save(ARENA_KEY, arena);
    }
    refresh(); openCat(activeCat);
  });

  refresh();
  const hash = location.hash.replace('#','');
  if (hash === 'contest' || hash === 'c' || hash === 'cpp' || hash === 'java' || hash === 'python') openCat('contest', false);
  else if (hash === 'lq' || hash === 'lanqiao') openCat('lq', false);
  else if (hash === 'a') openCat('a', false);
})();
</script>
</body>
</html>
