    <script>
        (function () {
            var $ = function (s) { return document.querySelector(s); };
            var CAT = LQ.catalog();
            var id = LQ.qs('id');
            var paperId = LQ.qs('p');

            var IO_HEADS = ['输入格式', '输出格式', '输入', '输出'];

            // 题解正文：保留换行（代码段不能被合并成一行），围栏代码转 pre，裸标题/链接轻量处理
            function solText(md) {
                var lines = String(md || '').replace(/\r/g, '').split('\n');
                var out = [], buf = [], code = [], inCode = false;
                function flushBuf() {
                    if (!buf.length) return;
                    out.push('<p>' + buf.join('<br>') + '</p>');
                    buf = [];
                }
                function flushCode() {
                    if (!code.length) return;
                    out.push('<pre class="sol-code">' + LQ.esc(code.join('\n')) + '</pre>');
                    code = [];
                }
                function inline(t) {
                    return LQ.esc(t)
                        .replace(/!\[\]\((https?:\/\/[^)\s]+)\)/g, '<img src="$1" alt="题解配图" loading="lazy">')
                        .replace(/\[([^\]]{1,80})\]\((https?:\/\/[^)\s]+)(?:\s+&quot;[^&]*&quot;|\s+"[^"]*")?\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
                        .replace(/`([^`\n]{1,80})`/g, '<code>$1</code>')
                        .replace(/\*\*([^*\n]{1,60})\*\*/g, '<b>$1</b>');
                }
                lines.forEach(function (l) {
                    if (/^\s*```/.test(l)) {
                        if (inCode) { flushCode(); inCode = false; }
                        else { flushBuf(); inCode = true; }
                        return;
                    }
                    if (inCode) { code.push(l); return; }
                    var t = l.trim();
                    if (!t) { flushBuf(); return; }
                    if (/^#{1,6}\s+/.test(t)) {
                        flushBuf();
                        out.push('<h5 class="sol-h">' + inline(t.replace(/^#{1,6}\s+/, '')) + '</h5>');
                        return;
                    }
                    if (/^[*\-_=]{3,}$/.test(t)) { flushBuf(); out.push('<hr class="sol-hr">'); return; }
                    buf.push(inline(l));
                });
                flushBuf();
                flushCode();
                return '<div class="sol-text">' + out.join('') + '</div>';
            }

            // 「让 AI 讲这题」→ 复用右侧 AI 卡的解析（用读者自己的 API Key）
            function bindAi(scope) {
                var btn = scope.querySelector('[data-ai]');
                if (!btn) return;
                btn.addEventListener('click', function () {
                    var t = document.getElementById('qaiExplain');
                    if (t) { t.click(); return; }
                    if (window.QuizAI) QuizAI.openSettings();
                });
            }

            function renderSol(q) {
                var mount = $('#sol');
                if (!mount) return;
                var head = function (em) {
                    return '<div class="sec-title" id="sec-sol"><span>Solution</span><b>题解</b><span class="sp"></span><em>' + em + '</em></div>';
                };
                if (q.src !== 'dotcpp') {
                    mount.innerHTML = head('洛谷题 · 未收录') +
                        '<div class="sol-empty" style="margin-top:14px"><span>本题来自洛谷题单，本站只收录 Dotcpp 题解区的题解。</span>' +
                        '<button type="button" class="sol-ai" data-ai>让 AI 讲这题</button>' +
                        '<a href="' + LQ.esc(q.url || '#') + '" target="_blank" rel="noopener">看洛谷讨论 ↗</a></div>';
                    bindAi(mount);
                    return;
                }
                mount.innerHTML = head('按需加载') +
                    '<div class="sol-empty" style="margin-top:14px"><span>题解通常带完整代码，先自己写一版；卡住了再加载，别让题解替你思考。</span>' +
                    '<button type="button" class="sol-ai" data-load-sol>加载题解</button>' +
                    '<a href="https://blog.dotcpp.com/tijie/p' + encodeURIComponent(q.id) + '/" target="_blank" rel="noopener">去 Dotcpp 看看 ↗</a></div>';

                mount.querySelector('[data-load-sol]').addEventListener('click', function () {
                    var btn = this;
                    btn.disabled = true;
                    btn.textContent = '加载中…';
                    mount.innerHTML = head('加载中…') + '<div class="sol-wrap" id="solWrap"></div>';
                    LQ.loadSol(q.year).then(function (pack) {
                        var list = (pack && pack[q.id]) || [];
                        var em = document.querySelector('#sec-sol em');
                        var wrap = document.querySelector('#solWrap');
                        if (!em || !wrap) return;
                        em.textContent = list.length ? list.length + ' 篇 · 来自 Dotcpp 博客' : '本题暂无收录题解';

                        if (!list.length) {
                            wrap.innerHTML = '<div class="sol-empty"><span>Dotcpp 题解区里这道题还没有题解，或都被隐藏了。</span>' +
                                '<button type="button" class="sol-ai" data-ai>让 AI 讲这题</button>' +
                                '<a href="https://blog.dotcpp.com/tijie/p' + encodeURIComponent(q.id) + '/" target="_blank" rel="noopener">去题解页看看 ↗</a></div>';
                            bindAi(wrap);
                            return;
                        }

                        wrap.innerHTML = list.map(function (a) {
                            return '<article class="sol-item">' +
                                '<header class="sol-head">' +
                                '<h4>' + LQ.esc(a.title || '未命名题解') + '</h4>' +
                                '<div class="sol-meta">' + [a.date, a.likes ? a.likes + ' 赞' : '', a.views ? a.views + ' 浏览' : '']
                                    .filter(Boolean).map(function (x) { return '<span>' + LQ.esc(x) + '</span>'; }).join('') + '</div>' +
                                '<span class="sol-arrow">展开 ↓</span>' +
                                '</header>' +
                                '<div class="sol-body" hidden>' + solText(a.md) + '</div>' +
                                '<div class="sol-foot"><span>内容来自 Dotcpp 博客，版权归原作者</span>' +
                                '<a href="https://blog.dotcpp.com/a/' + encodeURIComponent(a.aid) + '" target="_blank" rel="noopener">原文 ↗</a></div>' +
                                '</article>';
                        }).join('');

                        Array.prototype.forEach.call(wrap.querySelectorAll('.sol-head'), function (h) {
                            h.addEventListener('click', function () {
                                var item = h.parentNode;
                                var body = item.querySelector('.sol-body');
                                var on = item.classList.toggle('on');
                                body.hidden = !on;
                                item.querySelector('.sol-arrow').textContent = on ? '收起 ↑' : '展开 ↓';
                                if (on && LQ.renderMath) LQ.renderMath(body);
                            });
                        });
                    });
                });
            }

            LQ.problem(id).then(function (q) {
                document.title = q.title + ' · 蓝桥真题｜朝云暮辞';

                // 已读标记
                var seen = LQ.STORE.get('lq.seen', {}) || {};
                seen[q.id] = 1;
                LQ.STORE.set('lq.seen', seen);

                // 面包屑
                var paper = paperId ? LQ.paper(paperId) : null;
                $('#bc').innerHTML =
                    '<a href="index.html">蓝桥真题</a><span>/</span>' +
                    '<a href="index.html?y=' + encodeURIComponent(q.year) + '">' + LQ.esc(q.year) + '</a><span>/</span>' +
                    (paper ? '<a href="paper.html?p=' + encodeURIComponent(paper.id) + '">' + LQ.esc(paper.title) + '</a><span>/</span>' : '') +
                    '<span>' + LQ.esc(LQ.numText(q)) + '</span>';

                $('#phTop').innerHTML = [
                    '<span>' + LQ.esc(LQ.numText(q)) + '</span>',
                    '<span>·</span><span>' + LQ.esc(q.year) + '</span>',
                    '<span>·</span>' + LQ.labels.src(q.src)
                ].join('');
                $('#phTitle').textContent = q.title;

                // 输入 / 输出卡
                var ioIn = (q.sections || []).filter(function (s) { return /^输入(格式)?$/.test(s.h); })[0];
                var ioOut = (q.sections || []).filter(function (s) { return /^输出(格式)?$/.test(s.h); })[0];
                if (ioIn || ioOut) {
                    $('#ioGrid').innerHTML =
                        '<div class="io-card"><div class="cap">INPUT / 输入</div><div class="io-txt">' +
                        (ioIn ? LQ.md(ioIn.md) : '<span style="color:var(--muted)">原题未单列输入格式</span>') + '</div></div>' +
                        '<div class="io-card"><div class="cap">OUTPUT / 输出</div><div class="io-txt">' +
                        (ioOut ? LQ.md(ioOut.md) : '<span style="color:var(--muted)">原题未单列输出格式</span>') + '</div></div>';
                }

                // 其余章节
                var rest = (q.sections || []).filter(function (s) { return IO_HEADS.indexOf(s.h) < 0; });
                var outlineItems = [];
                var bodyHTML = '';

                if (rest.length) {
                    bodyHTML += '<div class="sec-title" id="sec-top"><span>01</span><b>题意与约束</b><span class="sp"></span><em>' + LQ.esc(q.year) + '</em></div>';
                    rest.forEach(function (s, i) {
                        var anchor = 'sec-' + i;
                        outlineItems.push([anchor, String(i + 2).padStart(2, '0'), s.h]);
                        bodyHTML += '<div class="prose" id="' + anchor + '" style="margin-top:22px">' +
                            '<div style="font-size:12.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.12em;margin-bottom:8px">' +
                            LQ.esc(s.h) + '</div>' + LQ.md(s.md) + '</div>';
                    });
                }
                // 配图：md 里没引用的图，统一补在正文末尾
                var mdAll = rest.map(function (s) { return s.md; }).join('\n');
                var extraImgs = (q.images || []).filter(function (src) {
                    return mdAll.indexOf(src.split('/').pop()) < 0;
                });
                if (extraImgs.length) {
                    bodyHTML += '<div class="sec-title"><span>Figure</span><b>题目配图</b><span class="sp"></span><em>' + extraImgs.length + ' 张</em></div>' +
                        '<div class="prose" style="margin-top:18px">' + extraImgs.map(function (src) {
                            return '<img src="' + LQ.esc(src) + '" alt="题目配图" loading="lazy" style="display:block;max-width:100%;border:1px solid var(--line);margin:0 0 14px">';
                        }).join('') + '</div>';
                }
                $('#body').innerHTML = bodyHTML;

                // 样例
                var samples = q.samples || [];
                outlineItems.unshift(['sec-top', '01', '题目与约束']);
                if (samples.length) {
                    outlineItems.push(['sec-samples', String(outlineItems.length + 1).padStart(2, '0'), '样例']);
                    $('#samples').innerHTML = '<div class="sec-title"><span>Samples</span><b>样例</b><span class="sp"></span><em>' +
                        (q.src === 'luogu' ? '洛谷原样' : '站点原样') + '</em></div>' +
                        '<div class="samples" id="sec-samples"><div class="s-tabs" id="sTabs"></div><div id="sBody"></div>' +
                        '<div class="note-bar" style="margin-top:12px"><b>说明</b><span id="sNote"></span></div></div>';
                    var tabs = $('#sTabs');
                    tabs.innerHTML = samples.map(function (s, i) {
                        return '<button data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>样例 ' + String(i + 1).padStart(2, '0') + '</button>';
                    }).join('');
                    function showSample(i) {
                        var s = samples[i];
                        $('#sBody').innerHTML = '<div class="sample-grid">' +
                            '<div class="sample-box"><div class="cap">输入</div><pre>' + LQ.esc(s.in || '') + '</pre></div>' +
                            '<div class="sample-box"><div class="cap">输出</div><pre>' + LQ.esc(s.out || '') + '</pre></div></div>';
                        var blocks = (s.in || '').split(/\n\s*\n/).filter(function (x) { return x.trim(); }).length;
                        $('#sNote').textContent = blocks > 1
                            ? '原页面把 ' + blocks + ' 组用例装在同一个样例框里，这里原样展示，做题时按题面分组读入。'
                            : (q.src === 'luogu' ? '样例照洛谷原样收录，测试数据为洛谷自造，与官方数据可能有差异。' : '样例照 Dotcpp 原样收录，空格与换行未作调整。');
                        Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b, n) {
                            b.classList.toggle('on', n === i);
                        });
                    }
                    Array.prototype.forEach.call(tabs.querySelectorAll('button'), function (b) {
                        b.addEventListener('click', function () { showSample(+b.dataset.i); });
                    });
                    showSample(0);
                } else {
                    outlineItems.push(['sec-samples', String(outlineItems.length + 1).padStart(2, '0'), '样例']);
                    $('#samples').innerHTML = '<div class="sec-title"><span>Samples</span><b>样例</b><span class="sp"></span><em>本题无样例</em></div>' +
                        '<div class="samples" id="sec-samples"><div class="empty-sample">' +
                        (q.src === 'luogu'
                            ? '洛谷页面本身没有给出样例（多为结果填空类题），不是本站漏抓。'
                            : '原题未提供样例。') + '</div></div>';
                }

                outlineItems.push(['sec-write', String(outlineItems.length + 1).padStart(2, '0'), '手敲代码']);
                $('#outline').innerHTML = outlineItems.map(function (x) {
                    return '<a href="#' + x[0] + '"><i>' + x[1] + '</i><span>' + LQ.esc(x[2]) + '</span></a>';
                }).join('');

                // 题解区
                renderSol(q);

                // 右侧信息
                var parts = LQ.trackParts(q.tracks);
                $('#sideId').textContent = LQ.numText(q);
                $('#sideBody').innerHTML = [
                    ['题号', LQ.esc(LQ.numText(q))],
                    ['来源', q.src === 'luogu' ? '洛谷题单' : 'Dotcpp'],
                    ['首见年份', q.year],
                    ['赛段', (q.stages || []).join(' / ') || '—'],
                    ['科目', parts.subject],
                    ['组别', parts.group],
                    ['难度', q.diff + (q.diffRaw && q.diffRaw !== q.diff ? ' · ' + q.diffRaw : '')],
                    ['通过率', LQ.pct(q.pct) + (q.pctFrom === 'luogu' ? '（洛谷口径）' : '（站点口径）')],
                    ['时限 / 内存', (q.timeLimit || '—') + ' / ' + (q.memLimit || '—')],
                    ['题目链接', '<a href="' + LQ.esc(q.url) + '" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:3px">打开 ↗</a>']
                ].map(function (x) {
                    return '<div class="row2"><span>' + LQ.esc(x[0]) + '</span><b>' + x[1] + '</b></div>';
                }).join('');

                // 错题本
                var wrongBtn = $('#lqWrong');
                function paintWrong() {
                    var wrong = LQ.STORE.get('lq.wrong', {}) || {};
                    var on = !!wrong[q.id];
                    wrongBtn.classList.toggle('on', on);
                    wrongBtn.textContent = on ? '已加入错题本 · 点击移出' : '加入错题本';
                    wrongBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
                }
                wrongBtn.addEventListener('click', function () {
                    var wrong = LQ.STORE.get('lq.wrong', {}) || {};
                    if (wrong[q.id]) {
                        delete wrong[q.id];
                    } else {
                        wrong[q.id] = {
                            id: q.id,
                            year: q.year,
                            title: q.title,
                            tracks: q.tracks || [],
                            src: q.src,
                            diff: q.diff,
                            pct: q.pct,
                            excerpt: q.sections && q.sections[0] ? String(q.sections[0].md || '').replace(/!\[[^\]]*\]\([^)]*\)/g, ' ').replace(/:::[^\s]*/g, ' ').replace(/[#*_>`\n\r]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120) : ''
                        };
                    }
                    LQ.STORE.set('lq.wrong', wrong);
                    paintWrong();
                });
                paintWrong();

                if (q.note) {
                    $('#noteCard').hidden = false;
                    $('#noteBody').innerHTML = LQ.md(q.note);
                }

                // 公式
                LQ.renderMath($('#main'));

                // 编辑器
                LQ.mountEditor({
                    mount: $('#editorMount'),
                    key: q.id,
                    lang: LQ.guessLang(q.tracks)
                });

                // AI 助教
                if (window.QuizAI) {
                    QuizAI.mount({
                        question: { kind: 'program', id: q.id, title: q.title, year: q.year },
                        aiRole: '蓝桥杯真题',
                        cardSub: '蓝桥真题',
                        language: 'C++',
                        sideSelector: '.p-side',
                        sideBefore: '#noteCard',
                        codeSelector: '#editorMount',
                        getCode: function () {
                            var ed = document.querySelector('#editorMount #ed');
                            return ed ? ed.value : '';
                        },
                        isRefVisible: function () { return false; },
                        explainPrompt: '请解析这道蓝桥杯真题：先讲考点和解题思路，再给关键步骤、样例推演、边界情况和复杂度；不要声称实际运行过程序，也不要一上来就给完整正确代码。',
                        contextText: function () {
                            var langBtn = document.querySelector('#editorMount .langs button.on');
                            var lang = langBtn ? langBtn.textContent.trim() : 'C++';
                            var ed = document.querySelector('#editorMount #ed');
                            var code = ed ? ed.value : '';
                            if (code.length > 6000) code = code.slice(0, 6000) + '\n…（代码过长，已截断）';
                            var stem = (q.sections || []).map(function (sec) {
                                return '【' + sec.h + '】\n' + (sec.md || '');
                            }).join('\n\n');
                            var samples = (q.samples || []).map(function (x, i) {
                                return '样例 ' + (i + 1) + '：\n输入：' + (x.in || '') + '\n输出：' + (x.out || '');
                            }).join('\n\n');
                            return [
                                '【题目】蓝桥杯真题 · ' + q.year + ' · ' + q.title + '（题号 ' + q.id + '）',
                                '【来源】' + (q.src === 'luogu' ? '洛谷题单' : 'Dotcpp'),
                                '【题面】\n' + stem,
                                (samples ? '【样例】\n' + samples : ''),
                                (q.note ? '【补充说明】\n' + q.note : ''),
                                '【用户手敲代码】\n~~~' + lang + '\n' + (code || '（空）') + '\n~~~',
                                '【参考代码】本题页面不提供官方参考代码，请不要假设或编造。'
                            ].filter(Boolean).join('\n\n');
                        }
                    });
                }

                // 上一题 / 下一题
                var list;
                if (paper) {
                    list = CAT.problems.filter(function (p) { return (p.papers || []).indexOf(paper.id) >= 0; });
                } else {
                    list = CAT.problems.filter(function (p) { return p.year === q.year; });
                }
                list.sort(function (a, b) {
                    return (a.src === b.src ? 0 : a.src === 'dotcpp' ? -1 : 1) ||
                        String(a.id).replace(/\D/g, '').padStart(6, '0').localeCompare(String(b.id).replace(/\D/g, '').padStart(6, '0'));
                });
                var at = list.map(function (p) { return p.id; }).indexOf(q.id);
                var prev = list[at - 1], next = list[at + 1];
                var qs = paper ? '&p=' + encodeURIComponent(paper.id) : '';
                $('#navPair').innerHTML =
                    (prev ? '<a href="problem.html?id=' + encodeURIComponent(prev.id) + qs + '"><span class="k">← 上一题 · ' + (at + 1) + ' / ' + list.length + '</span><span class="t">' + LQ.esc(prev.title) + '</span></a>'
                        : '<a class="ph"><span class="k">← 上一题</span><span class="t">已是本组第一题</span></a>') +
                    (next ? '<a class="next" href="problem.html?id=' + encodeURIComponent(next.id) + qs + '"><span class="k">' + (at + 2) + ' / ' + list.length + ' · 下一题 →</span><span class="t">' + LQ.esc(next.title) + '</span></a>'
                        : '<a class="ph next"><span class="k">下一题 →</span><span class="t">已是本组最后一题</span></a>');

                // 键盘左右切题（不在输入框里时）
                document.addEventListener('keydown', function (e) {
                    var tag = (e.target.tagName || '').toLowerCase();
                    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
                    if (e.key === 'ArrowLeft' && prev) location.href = 'problem.html?id=' + encodeURIComponent(prev.id) + qs;
                    if (e.key === 'ArrowRight' && next) location.href = 'problem.html?id=' + encodeURIComponent(next.id) + qs;
                });
            }).catch(function (err) {
                $('#phTitle').textContent = '没有这道题';
                $('#body').innerHTML = '<div class="empty-sample">' + LQ.esc(err.message) + '。回<a href="index.html" style="text-decoration:underline">大厅</a>重新选一道。</div>';
                $('#phTop').textContent = LQ.esc(id || '缺少题号参数');
            });
        })();
    </script>
    <script src="../../assets/js/site.js" defer></script>
</body>

</html>
