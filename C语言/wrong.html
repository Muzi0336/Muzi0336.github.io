<script src="data.js"></script>
<script>
(function(){
  const KEY = 'cquiz.ans.v1';
  const D = window.CDATA;
  const book = document.getElementById('book');
  const num = document.getElementById('wrongNum');
  const gn = document.getElementById('groupNum');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } }
  function save(all){ try { localStorage.setItem(KEY, JSON.stringify(all)); } catch(e){} }

  function render(){
    const all = load();
    const items = D.questions.filter(q => all[q.id] && all[q.id].ok === false)
      .sort((a,b) => String(b.year).localeCompare(String(a.year)) || a.no - b.no);
    num.textContent = items.length;
    const years = [...new Set(items.map(q => q.year))];
    gn.textContent = years.length + ' 个年份';
    if (!items.length){
      book.innerHTML = `<div class="empty" style="display:block"><b>还没有 C 语言错题</b>回到真题，选错一道单选题，它就会自动出现在这里。</div>`;
      return;
    }
    book.innerHTML = years.map(year => {
      const list = items.filter(q => q.year === year);
      return `<section class="wrong-group">
        <div class="wrong-head"><h2>${year} 年</h2><span>${list.length} 道</span></div>
        ${list.map(q => `<div class="wrong-row">
          <a href="q.html?id=${encodeURIComponent(q.id)}"><span class="wid">${esc(q.id)}</span><span class="wtitle">${esc(q.title)}</span><span class="wmeta">单选题 ${q.no} · 答错</span></a>
          <button type="button" data-id="${esc(q.id)}">移出</button>
        </div>`).join('')}
      </section>`;
    }).join('');
  }

  book.addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    const all = load(); delete all[b.dataset.id]; save(all); render();
  });

  document.getElementById('clearAll').addEventListener('click', () => {
    const all = load();
    let n = 0;
    Object.keys(all).forEach(id => { if (all[id] && all[id].ok === false){ delete all[id]; n++; } });
    if (!n) return;
    if (!confirm('清空 C 语言错题本？答对的记录会保留。')) return;
    save(all); render();
  });

  render();
})();
</script>
