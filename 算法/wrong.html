<script src="assets/app_data.js"></script>
<script src="assets/arena.js"></script>
<script>
(function(){
  const box = document.getElementById('book');
  const num = document.getElementById('wrongNum');
  const gn = document.getElementById('groupNum');

  function render(){
    const all = A.data.problems.filter(p => A.isWrong(p.id));
    num.textContent = all.length;
    const tracks = A.data.tracks.map(t => t.name).filter(t => all.some(p => p.track === t));
    gn.textContent = tracks.length + ' 个分类';
    if (!all.length){
      box.innerHTML = `<div class="ar-empty"><b>错题本是空的。</b>在题目页点「加入错题本」，题目就会按分类出现在这里。</div>`;
      return;
    }
    box.innerHTML = tracks.map(track => {
      const list = all.filter(p => p.track === track);
      return `<section class="wrong-group">
        <div class="wrong-head"><h2>${A.esc(track)}</h2><span>${list.length} 道</span></div>
        ${list.map(p => `<div class="wrong-row">
          <a href="q.html?id=${p.id}"><span class="wrong-id">${p.id}</span><span class="wrong-title">${A.esc(p.title)}</span><span class="wrong-meta">${A.esc(p.difficulty)} · ${p.minutes} MIN</span></a>
          <button type="button" data-id="${p.id}">移出</button>
        </div>`).join('')}
      </section>`;
    }).join('');
  }

  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (!b) return;
    A.toggleWrong(b.dataset.id);
    render();
  });

  document.getElementById('clearAll').addEventListener('click', () => {
    if (!A.wrongCount()) return;
    if (!confirm('清空算法错题本？题目进度和收藏不会受影响。')) return;
    A.state.wrong = {};
    A.save();
    render();
  });

  render();
})();
</script>
</body>
</html>
