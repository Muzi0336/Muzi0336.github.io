<script src="assets/app_data.js"></script>
<script src="assets/arena.js"></script>
<script>
(function(){
  const all = A.data.problems;
  const wrap = document.getElementById('paths');
  const s = A.summary();
  document.getElementById('doneNum').textContent = s.done;
  document.getElementById('allNum').textContent = '共 ' + all.length + ' 题';

  wrap.innerHTML = A.data.paths.map((p, pi) => {
    const probs = p.problems.map(id => A.byId(id)).filter(Boolean);
    const done = probs.filter(x => A.statusOf(x.id) === 'done').length;
    const pct = probs.length ? Math.round(done / probs.length * 100) : 0;
    return `<div class="path-item">
      <div class="path-head">
        <div class="path-no">${p.index} / PATH</div>
        <div>
          <div class="path-title">${A.esc(p.name)}</div>
          <div class="path-desc">${A.esc(p.description)}</div>
          ${p.lede ? `<div class="path-lede">${A.esc(p.lede)}</div>` : ''}
          <div class="path-bar"><i style="width:${pct}%"></i></div>
          <button class="path-toggle" data-i="${pi}" type="button">展开 ${probs.length} 道题 ↓</button>
        </div>
        <div class="path-side"><b>${probs.length} 题</b>已完成 ${done} · ${pct}%<br>计划 ${p.planned_count} 题</div>
      </div>
      <div class="path-probs" id="pp${pi}">
        ${probs.map(x => {
          const st = A.statusOf(x.id);
          return `<a class="path-prob" href="q.html?id=${x.id}"><span class="q">${x.id}</span><span class="dot ${st === 'done' ? 'done' : st === 'reading' ? 'read' : ''}"></span><span class="t">${A.esc(x.title)}</span></a>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.path-toggle').forEach(btn => btn.addEventListener('click', () => {
    const box = document.getElementById('pp' + btn.dataset.i);
    const open = box.classList.toggle('open');
    btn.textContent = open ? `收起题目 ↑` : `展开 ${box.children.length} 道题 ↓`;
  }));
})();
</script>
</body>
</html>
